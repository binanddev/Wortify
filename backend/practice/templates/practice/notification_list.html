{% for n in notifications %}<article id="notice-{{ n.pk }}" class="notice"><a href="{% url 'result' n.attempt_id %}" hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML show:top">{{ n.text }}</a><form method="post" action="{% url 'read_notification' n.pk %}" hx-post="{% url 'read_notification' n.pk %}" hx-boost="false" hx-target="#notice-{{ n.pk }}" hx-select="unset" hx-push-url="false" hx-swap="outerHTML swap:180ms">{% csrf_token %}<button class="text-button" type="submit">Đã đọc</button></form></article>{% empty %}<p class="muted">Chưa có thông báo mới.</p>{% endfor %}
