<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Thiết lập quản trị · Wortify</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5f2,#e4ebfa);color:#152740;font:17px system-ui,sans-serif}main{width:min(100%,440px);padding:32px;background:#ffffffdb;border:1px solid white;border-radius:24px;box-shadow:0 20px 70px #243a6020}h1{font-size:26px}label{display:block;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #9aabc0;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;background:#223e62;color:white;font:inherit;cursor:pointer}.errorlist,.error{color:#a21e36;font-size:14px}.helptext{display:block;font-size:13px;color:#52657b}a{color:#223e62}small{letter-spacing:.15em}
</style></head><body><main><small>WORTIFY</small>
{% if complete %}<h1>Đã tạo quản trị viên</h1><p>Bạn có thể đăng nhập bằng tài khoản vừa tạo.</p><a href="/">Về trang đăng nhập</a>
{% else %}<h1>Tạo quản trị viên đầu tiên</h1><p>Nhập thông tin tài khoản và khóa thiết lập.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}
<label for="setup-key">Khóa thiết lập</label><input id="setup-key" name="setup_key" type="password" autocomplete="off" required>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<button type="submit">Tạo tài khoản quản trị</button></form>{% endif %}
</main></body></html>
