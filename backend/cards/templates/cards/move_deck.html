<details class="deck-move" x-data="{ open: false }" @toggle="open = $el.open" @keydown.escape=" $el.open = false "><summary>Chuyển thư mục</summary><form x-show="open" x-transition.opacity.duration.180ms method="post" action="{% url 'deck_move' deck.pk %}" class="toolbar">{% csrf_token %}<input type="hidden" name="source" value="{{ source }}"><label for="move-{{ deck.pk }}">Chuyển đến</label><select id="move-{{ deck.pk }}" name="folder"><option value="">Ngoài thư mục</option>{% for item in folders %}<option value="{{ item.pk }}" {% if item.pk == deck.folder_id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select><button class="primary">Di chuyển</button></form></details>
