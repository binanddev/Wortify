# Legacy HTTP/local example only. Production: deploy/nginx/edge.conf.example + deploy/compose.*.yml (see root README).
# Example server block. Adjust server_name, paths and TLS for your deployment.
# Run npm run build, then Django collectstatic for admin assets only.
server {
    listen 80;
    server_name localhost;
    root /srv/wortify/frontend-react/dist;
    index index.html;
    client_max_body_size 12m;

    location ~ ^/api/(en|de)/practice-hub/media/ {
        client_max_body_size 201m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api { return 308 /api/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin { return 308 /admin/; }
    location /static/admin/ {
        alias /srv/wortify/backend/staticfiles/admin/;
    }
    # Compatibility for media URLs already stored in lesson payloads.
    location /static/react/ {
        alias /srv/wortify/frontend-react/dist/;
    }
    location /assets/ { try_files $uri =404; }
    location /audio/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
