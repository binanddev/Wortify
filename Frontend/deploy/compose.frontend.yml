# Frontend-only machine. The browser still uses the public frontend origin for /api/.
services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:?Set private backend origin}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
