services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-wortify}
      POSTGRES_USER: ${DJANGO_DB_USER:-wortify}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_MONITOR_SECRET: ${BACKEND_MONITOR_SECRET:-}
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST:?Set PUBLIC_HOST},localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
      DJANGO_TRUST_PROXY: "1"
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-wortify}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-wortify}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD}
      DJANGO_DB_HOST: db
      DJANGO_MEDIA_ROOT: /app/private_media
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
    volumes:
      - media:/app/private_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/check/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  database:
  media:
