name: Project checks
on:
  pull_request:
  push:
    branches: [main, minhtien]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: '1'
      DATABASE_URL: ''
      MEDIA_STORAGE: local
      WORTIFY_ENV_FILE: /tmp/wortify-ci-empty.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Realtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: touch "$WORTIFY_ENV_FILE"
      - run: python -m pip install -r Backend/requirements.txt
      - run: npm ci --prefix Frontend
      - run: npm ci --prefix Realtime
      - run: python Backend/manage.py check
      - run: python Backend/manage.py makemigrations --check --dry-run
      - run: python Backend/manage.py test --noinput
      - run: npm test
      - run: npm test --prefix Realtime
      - run: npm run build
      - run: npx --prefix Frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix Frontend
        env:
          E2E_PYTHON: python
      - run: npm run test:e2e:clean-start --prefix Frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 7
